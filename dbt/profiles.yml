# Bağlantı bilgileri ortam değişkenlerinden okunur; şifre repoya girmez.
# Yerelde `python -m bvt.dbt_runner ...` .env dosyasını yükleyip dbt'yi bu dizinle çağırır.
# Airflow konteynerinde değişkenler docker-compose.yml'den gelir (POSTGRES_HOST=postgres).
bvt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'bvt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'bvt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'borsa') }}"
      # Şeması belirtilmeyen modeller buraya gider; staging modelleri `staging` şemasına yazılır.
      schema: marts
      threads: 4
      connect_timeout: 10
      keepalives_idle: 0
