# BorsaVeriTakip dbt projesi: raw.* (Python çekiciler) → staging.stg_* → marts.* (Gün 9+)
name: bvt
version: "0.1.0"
config-version: 2
profile: bvt

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  use_colors: false

models:
  bvt:
    staging:
      # Görünüm: raw değiştikçe her zaman günceldir, ek depolama yok. Şema adı olduğu gibi kullanılır
      # (bkz. macros/generate_schema_name.sql) → staging.stg_*
      +schema: staging
      +materialized: view
      +docs:
        node_color: "#4a90d9"
    marts:
      # Tablo: gösterge/korelasyon sorguları ve API için hızlı okuma; her build'de baştan kurulur (veri küçük).
      +schema: marts
      +materialized: table
      +docs:
        node_color: "#2e8b57"

seeds:
  bvt:
    # Elle tutulan referans verisi (enstrüman tanımları) → staging.instrument_metadata
    +schema: staging
    +quote_columns: false
