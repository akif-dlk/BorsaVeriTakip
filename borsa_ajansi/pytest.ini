[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: gerçek ağ erişimi gerektirir (varsayılan atlanır, -m network ile çalışır)
    llm: gerçek Claude API çağrısı yapar (ANTHROPIC_API_KEY gerekir)
addopts = -m "not network and not llm"
