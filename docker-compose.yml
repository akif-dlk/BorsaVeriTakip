name: borsaveritakip

# Airflow servislerinin ortak ayarları (LocalExecutor, metadata için ayrı PostgreSQL).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: bvt-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Istanbul
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Istanbul
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-bvt-dev-only-secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    TZ: Europe/Istanbul
    # Proje paketi (bvt) ve veri veritabanı; konteyner ağı içinde port her zaman 5432
    PYTHONPATH: /opt/bvt/src
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-bvt}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bvt}
    POSTGRES_DB: ${POSTGRES_DB:-borsa}
    EVDS_API_KEY: ${EVDS_API_KEY:-}
    EVDS_BASE_URL: ${EVDS_BASE_URL:-}
    BVT_LOOKBACK_DAYS: ${BVT_LOOKBACK_DAYS:-7}
    BVT_GAP_CHECK_DAYS: ${BVT_GAP_CHECK_DAYS:-30}
    BVT_LOG_LEVEL: ${BVT_LOG_LEVEL:-INFO}
    # Alarm kanalları (boşsa kanal devre dışı; bkz. .env.example)
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    BVT_STALE_AFTER_DAYS: ${BVT_STALE_AFTER_DAYS:-2}
    BVT_ALERT_COOLDOWN_HOURS: ${BVT_ALERT_COOLDOWN_HOURS:-12}
    # dbt: proje salt-okunur bağlanır; derleme çıktısı ve loglar konteyner içinde geçici dizine yazılır
    BVT_DBT_DIR: /opt/bvt/dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/bvt/src:ro
    - ./sql:/opt/bvt/sql:ro
    - ./dbt:/opt/bvt/dbt:ro
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: bvt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bvt}
      POSTGRES_DB: ${POSTGRES_DB:-borsa}
      TZ: Europe/Istanbul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Airflow metadata veritabanı: proje verisinden ayrı tutulur (yedekleme/sıfırlama bağımsız olsun)
  airflow-db:
    image: postgres:16-alpine
    container_name: bvt-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tek seferlik: metadata şemasını taşır, yönetici kullanıcıyı oluşturur, proje şemasını (sql/init) uygular
  airflow-init:
    <<: *airflow-common
    container_name: bvt-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname BVT --lastname Admin --email admin@example.com || true
        python -m bvt.db --init
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: bvt-airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: bvt-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-pgdata:
